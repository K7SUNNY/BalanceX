def getGitCommitCount() {
    try {
        // Use .text to safely consume the stream and avoid buffer deadlocks
        def output = "git rev-list --count HEAD".execute(null, project.rootDir).text.trim()
        return output.toInteger()
    } catch (Exception ignored) {}
    return 1
}

def getGitVersionName(baseVersion) {
    def commitCount = getGitCommitCount()
    def dirty = ""
    try {
        def process = "git status --porcelain".execute(null, project.rootDir)
        // Read text FIRST to empty the buffer before the process finishes
        def output = process.text.trim()
        if (process.exitValue() == 0 && output.length() > 0) {
            dirty = "-dirty"
        }
    } catch (Exception ignored) {}
    return "${baseVersion}.${commitCount}${dirty}"
}

android {
    namespace 'com.k7sunny.balancex'
    compileSdk 37

    defaultConfig {
        applicationId "com.k7sunny.balancex"
        minSdk 24
        targetSdk 35
        versionCode getGitCommitCount()
        versionName getGitVersionName(project.findProperty("VERSION_BASE") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

